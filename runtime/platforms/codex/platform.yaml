---
name: codex
description: >
  Tier 1 adapter for OpenAI Codex. Maps Sage's process engine onto Codex-native
  instructions, repo skills, project configuration, worktree-aware execution,
  and multi-agent workflows.
version: "1.0.0"
tier: 1
capabilities:
  subagents: true
  parallel-execution: true
  worktrees: true
  hooks: true
  slash-commands: false
  skill-auto-activation: true
  file-system-access: true
  multi-model: true
command-prefix: "prompt"
install-method: workspace-setup
supported-os: [linux, macos, windows]

paths:
  instructions-global: "~/.codex/AGENTS.md"
  instructions-workspace: "AGENTS.md"
  skills-global: "~/.agents/skills/"
  skills-workspace: ".agents/skills/"
  config-global: "~/.codex/config.toml"
  config-workspace: ".codex/config.toml"
  hooks-workspace: ".codex/hooks.json"
  sage-state: ".sage/"

codex:
  builtin-commands:
    - name: review
      description: "Use Codex built-in /review for diff-oriented review passes."
    - name: init
      description: "Use Codex built-in /init only for ad hoc AGENTS scaffolding outside Sage."
  notes:
    - "Sage workflow entry remains prompt-driven and skill-driven; Codex built-in commands complement but do not replace Sage workflows."
    - "Codex worktrees are a native Git-repository feature, including Local/Worktree handoff and worktree-backed automations; Sage relies on those native flows rather than generating a separate worktree layer."
    - "Codex hooks exist behind [features].codex_hooks = true, but Sage treats them as experimental and does not claim Claude-style lifecycle parity."
    - "Sage keeps .agents/skills as the primary repo skill surface for compatibility with current Codex skills discovery and external-config import flows."
---
